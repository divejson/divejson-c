name: Release

# A `v<version>` tag on main publishes ghcr.io/divejson/divejson-c:<version> for linux/amd64
# and linux/arm64, and a GitHub release whose notes are CHANGELOG.md's section for the version
# and name the libdivecomputer commit the binary carries. Nothing else publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # A tag naming a version nobody built would publish an image whose --version disagrees
      # with its tag; refuse it rather than publish.
      - name: The tag, CMakeLists.txt, divejson.h and CHANGELOG.md name one version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(sed -n 's/^project(divejson VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)"
          header="$(sed -n 's/^#define DIVEJSON_VERSION "\(.*\)"/\1/p' include/divejson.h)"
          echo "tag $tag, CMakeLists.txt $project, divejson.h $header"
          test "$tag" = "$project"
          test "$tag" = "$header"
          grep -q "^## $tag\$" CHANGELOG.md
          commit="$(tr -d '[:space:]' < LIBDIVECOMPUTER_COMMIT)"
          test "$commit" = "$(git ls-tree HEAD vendor/libdivecomputer | awk '{print $3}')"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/divejson/divejson-c:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/divejson/divejson-c
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT AND LGPL-2.1-or-later

      - name: The published image lists both architectures and prints its version
        env:
          IMAGE: ghcr.io/divejson/divejson-c:${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$IMAGE" | grep -q 'linux/arm64'
          for platform in linux/amd64 linux/arm64; do
            printed="$(docker run --rm --platform "$platform" "$IMAGE" --version)"
            echo "$platform: $printed"
            test "$printed" = "$VERSION+${COMMIT:0:7}"
          done

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          {
            awk -v heading="## $VERSION" '$0 == heading {found = 1; next} found && /^## / {exit} found' CHANGELOG.md
            echo
            echo "divejson-raw carries libdivecomputer from [deepsealabs/libdivecomputer](https://github.com/deepsealabs/libdivecomputer) at \`$COMMIT\`."
            echo "The image is \`ghcr.io/divejson/divejson-c:$VERSION\`, for linux/amd64 and linux/arm64."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
